name: authz-comment
# Workflow B (security #2): never runs PR code. Checks out the default branch only, treats diff.json as untrusted
# data (comment.py escapes + redacts + caps), posts the comment. Same-repo PRs only: for fork PRs
# workflow_run.pull_requests is empty and this job does nothing (documented fork policy).
on:
  workflow_run:
    workflows: [authz-probe]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: authz-diff
          path: untrusted
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Render and post
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          python3 comment.py untrusted/diff.json "" > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
